---
meta:
  productName: "terraform-aws-executors"
  owners:
    - "sourcegraph/release"
  repository: "github.com/sourcegraph/terraform-aws-executors"
inputs:
  - releaseId: server
requirements:
  - name: "comby"
    cmd: "which comby"
    fixInstructions: "install comby"
  - name: "GitHub CLI"
    cmd: "which gh"
    fixInstructions: "install GitHub cli"
internal:
  create:
    steps:
      minor:
        - name: "release:setup"
          cmd: |
            # Convert the tag to the image family format, which uses hyphens and only major-minor.
            echo "{{tag}}" | grep -o -E "[[:digit:]]+\.[[:digit:]]+" | sed 's/\./-/' > family_tag
        - name: "files(README.md)"
          cmd: |
            comby 'registry.terraform.io/modules/sourcegraph/executors/aws/:[version~\d+\.\d+\.\d+]' 'registry.terraform.io/modules/sourcegraph/executors/aws/{{tag}}' -i -f .md
            comby 'github.com/sourcegraph/terraform-aws-executors/blob/v:[version~\d+\.\d+\.\d+]' 'github.com/sourcegraph/terraform-aws-executors/blob/v{{tag}}' -i -f .md
        - name: "files(tf)"
          cmd: |
            comby 'version = ":[version~\d+\.\d+\.\d+]" # LATEST' 'version = "{{tag}}" # LATEST' -i -f .tf
        - name: "family(name):docker-mirror"
          cmd: comby '["sourcegraph-executors-docker-mirror-:[~\d+-\d+]-*"]' "[\"sourcegraph-executors-docker-mirror-$(cat family_tag)-*\"]" -i -f .tf
        - name: "family(name):sourcegraph"
          cmd: comby '["sourcegraph-executors-:[~\d+-\d+]-*"]' "[\"sourcegraph-executors-$(cat family_tag)-*\"]" -i -f .tf
        - name: "release:verify"
          cmd: |
            set -eu
            family_tag=$(cat family_tag)

            grep -Fq "sourcegraph-executors-docker-mirror-${family_tag}-*" modules/docker-mirror/main.tf
            grep -Fq "sourcegraph-executors-${family_tag}-*" modules/executors/main.tf

            if grep -REh --include='*.md' 'registry\.terraform\.io/modules/sourcegraph/executors/aws/[0-9]+\.[0-9]+\.[0-9]+|github\.com/sourcegraph/terraform-aws-executors/blob/v[0-9]+\.[0-9]+\.[0-9]+' . | grep -Fv '{{tag}}'; then
              echo "WARNING: Found a stale Terraform module reference after release updates"
            fi

            if grep -REh --include='*.tf' 'version[[:space:]]*=[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"[[:space:]]*# LATEST' . | grep -Fv '"{{tag}}"'; then
              echo "WARNING: Found a stale Terraform module version after release updates"
            fi

            git diff --quiet -- modules/docker-mirror/main.tf && {
              echo "Docker mirror image family was not updated"
              exit 1
            }
            git diff --quiet -- modules/executors/main.tf && {
              echo "Executor image family was not updated"
              exit 1
            }
        - name: "cleanup"
          cmd: |
            # remove files we used in previous steps
            rm -vf family_tag
        - name: "git:branch"
          cmd: |
            set -eu
            branch="internal/release-{{version}}"
            echo "Creating branch $branch"
            git checkout -b $branch
        - name: "git:commit"
          cmd: |
            # Careful with the quoting for the config, using double quotes will lead
            # to the shell dropping out all quotes from the json, leading to failed
            # parsing.
            git commit -am "release_minor: {{version}}" -m '{{config}}'
        - name: "git:push"
          cmd: |
            branch="internal/release-{{version}}"
            git push origin "$branch"
        - name: "github:pr"
          cmd: |
            set -eu
            gh pr create \
              --fill \
              --draft \
              --title "(internal) release_minor: build {{version}}" \
              --body "Test plan: automated release PR, CI will perform additional checks"
            echo "🚢 Please check the associated CI build to ensure the process completed".
      major:
        - name: "release:setup"
          cmd: |
            # Convert the tag to the image family format, which uses hyphens and only major-minor.
            echo "{{tag}}" | grep -o -E "[[:digit:]]+\.[[:digit:]]+" | sed 's/\./-/' > family_tag
        - name: "files(README.md)"
          cmd: |
            comby 'registry.terraform.io/modules/sourcegraph/executors/aws/:[version~\d+\.\d+\.\d+]' 'registry.terraform.io/modules/sourcegraph/executors/aws/{{tag}}' -i -f .md
            comby 'github.com/sourcegraph/terraform-aws-executors/blob/v:[version~\d+\.\d+\.\d+]' 'github.com/sourcegraph/terraform-aws-executors/blob/v{{tag}}' -i -f .md
        - name: "files(tf)"
          cmd: |
            comby 'version = ":[version~\d+\.\d+\.\d+]" # LATEST' 'version = "{{tag}}" # LATEST' -i -f .tf
        - name: "family(name):docker-mirror"
          cmd: comby '["sourcegraph-executors-docker-mirror-:[~\d+-\d+]-*"]' "[\"sourcegraph-executors-docker-mirror-$(cat family_tag)-*\"]" -i -f .tf
        - name: "family(name):sourcegraph"
          cmd: comby '["sourcegraph-executors-:[~\d+-\d+]-*"]' "[\"sourcegraph-executors-$(cat family_tag)-*\"]" -i -f .tf
        - name: "release:verify"
          cmd: |
            set -eu
            family_tag=$(cat family_tag)

            grep -Fq "sourcegraph-executors-docker-mirror-${family_tag}-*" modules/docker-mirror/main.tf
            grep -Fq "sourcegraph-executors-${family_tag}-*" modules/executors/main.tf

            if grep -REh --include='*.md' 'registry\.terraform\.io/modules/sourcegraph/executors/aws/[0-9]+\.[0-9]+\.[0-9]+|github\.com/sourcegraph/terraform-aws-executors/blob/v[0-9]+\.[0-9]+\.[0-9]+' . | grep -Fv '{{tag}}'; then
              echo "WARNING: Found a stale Terraform module reference after release updates"
            fi

            if grep -REh --include='*.tf' 'version[[:space:]]*=[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+"[[:space:]]*# LATEST' . | grep -Fv '"{{tag}}"'; then
              echo "WARNING: Found a stale Terraform module version after release updates"
            fi

            git diff --quiet -- modules/docker-mirror/main.tf && {
              echo "Docker mirror image family was not updated"
              exit 1
            }
            git diff --quiet -- modules/executors/main.tf && {
              echo "Executor image family was not updated"
              exit 1
            }
        - name: "cleanup"
          cmd: |
            # remove files we used in previous steps
            rm -vf family_tag
        - name: "git:branch"
          cmd: |
            set -eu
            branch="internal/release-{{version}}"
            echo "Creating branch $branch"
            git checkout -b $branch
        - name: "git:commit"
          cmd: |
            # Careful with the quoting for the config, using double quotes will lead
            # to the shell dropping out all quotes from the json, leading to failed
            # parsing.
            git commit -am "release_major: {{version}}" -m '{{config}}'
        - name: "git:push"
          cmd: |
            branch="internal/release-{{version}}"
            git push origin "$branch"
        - name: "github:pr"
          cmd: |
            set -eu
            gh pr create \
              --fill \
              --draft \
              --title "(internal) release_major: build {{version}}" \
              --body "Test plan: automated release PR, CI will perform additional checks"
            echo "🚢 Please check the associated CI build to ensure the process completed".
  finalize:
    steps:
      - name: "notifications"
        cmd: |
          set -eu

          branch="internal/release-{{version}}"

          # Post a comment on the PR.
          cat << EOF | gh pr comment "$branch" --body-file -
          - :green_circle: Internal release is ready for promotion!
          - :warning: Do not close/merge the pull request or delete the associated branch if you intend to promote it.
          EOF
          # Post an annotation.
          cat << EOF | buildkite-agent annotate --style info
          Internal release is ready for promotion under the branch [\`$branch\`](https://github.com/sourcegraph/terraform-aws-executors/tree/$branch).
          EOF

      # - name: 'Register on release registry'
      #   cmd: |
      #     echo "Registering internal terraform-aws-executors {{version}} release on release registry"
      #     body=$(wget --content-on-error -O- --header="Content-Type: application/json" --header="Authorization: ${RELEASE_REGISTRY_TOKEN}" --post-data '{
      #         "name": "terraform-aws-executors",
      #         "version": "{{version}}",
      #         "git_sha": "'${COMMIT_SHA}'"
      #       }' "https://releaseregistry.sourcegraph.com/v1/releases")
      #     exit_code=$?

      #     if [ $exit_code != 0 ]; then
      #       echo "❌ Failed to create release in release registry, got:"
      #       echo "--- raw body ---"
      #       echo $body
      #       echo "--- raw body ---"
      #       exit $exit_code
      #     else
      #       echo "Release created, see:"
      #       echo $body
      #     fi

test:
  steps:
    - name: "noop"
      cmd: "true"

promoteToPublic:
  create:
    steps:
      - name: "git"
        cmd: |
          set -eu
          branch="internal/release-{{version}}"
          echo "Checking out origin/${branch}"
          git fetch origin "${branch}"
          git switch "${branch}"
      # Since we're promoting to public we need to remove the "internal" from the family
      - name: "family(name):docker-mirror"
        cmd: comby '["sourcegraph-executors-docker-mirror-:[family_tag_hole~\d+-\d+]-*"]' "[\"sourcegraph-executors-docker-mirror-:[family_tag_hole]-*\"]" -i -f .tf
      - name: "family(name):sourcegraph"
        cmd: comby '["sourcegraph-executors-:[family_tag_hole~\d+-\d+]-*"]' "[\"sourcegraph-executors-:[family_tag_hole]-*\"]" -i -f .tf
      - name: "git:branch"
        cmd: |
          set -eu
          branch="promote/release-{{version}}"
          git switch -c "${branch}"
      - name: "git:commit"
        cmd: |
          set -eu
          branch="promote/release-{{version}}"
          find . -name "*.yaml" | xargs git add
          find . -name "*.yml" | xargs git add

          # Careful with the quoting for the config, using double quotes will lead
          # to the shell dropping out all quotes from the json, leading to failed
          # parsing.
          git commit --allow-empty -am 'promote-release: {{version}}' -m '{{config}}'
          git push origin "${branch}"
      - name: "github:pr"
        cmd: |
          set -eu
          internal_branch="internal/release-{{version}}"
          gh pr create \
            --fill \
            --draft \
            --base "$internal_branch" \
            --title "(promote) release: build {{version}}" \
            --body "Test plan: automated release PR, CI will perform additional checks"
          echo "🚢 Please check the associated CI build to ensure the process completed".
  finalize:
    steps:
      # - name: 'Promote on release registry'
      #   cmd: |
      #     echo "Promoting terraform-aws-executors {{version}} release on release registry"
      #     body=$(wget --content-on-error -O- --header="Content-Type: application/json" --header="Authorization: ${RELEASE_REGISTRY_TOKEN}" --post-data '' "https://releaseregistry.sourcegraph.com/v1/releases/terraform-aws-executors/{{version}}/promote")
      #     exit_code=$?

      #     if [ $exit_code != 0 ]; then
      #       echo "❌ Failed to promote release on release registry, got:"
      #       echo "--- raw body ---"
      #       echo $body
      #       echo "--- raw body ---"
      #       exit $exit_code
      #     else
      #       echo "Release promoted, see:"
      #       echo $body
      #     fi
      - name: git:tag
        cmd: |
          set -eu

          # Branches
          internal_branch="internal/release-{{version}}"
          promote_branch="promote/release-{{version}}"
          release_branch="release-{{version}}"

          # Create the final branch holding the tagged commit
          git checkout "${promote_branch}"
          git switch -c "${release_branch}"
          git tag {{version}}
          git push origin ${release_branch} --tags

          # Web URL to the tag
          tag_url="https://github.com/sourcegraph/terraform-aws-executors/tree/{{version}}"

          # Annotate PRs
          cat << EOF | gh pr comment "$internal_branch" --body-file -
          - :green_circle: Release has been promoted, see tag: $tag_url.
          - :no_entry: Do not under any circumstance delete the branch holding the tagged commit (i.e. \`$release_branch\`).
          - :arrow_right: You can safely close the PR and delete its a associated branch.
          EOF

          cat << EOF | gh pr comment "$promote_branch" --body-file -
          - :green_circle: Release has been promoted, see tag: $tag_url.
          - :no_entry: Do not under any circumstance delete the branch holding the tagged commit (i.e. \`$release_branch\`).
          - :arrow_right: You can safely close that PR and delete its a associated branch.
          EOF

          # Annotate build
          cat << EOF | buildkite-agent annotate --style info
          Promoted release is **publicly available** through a git tag at [\`{{version}}\`](https://github.com/sourcegraph/terraform-aws-executors/tree/{{version}}).
          EOF
